{# The language switch: the other language, written in itself. #}
{% if lang == 'en' %}<a class="lang-switch" href="{{ url_for('main.set_lang', code='ar') }}" lang="ar" hreflang="ar">العربية</a>
{% else %}<a class="lang-switch" href="{{ url_for('main.set_lang', code='en') }}" lang="en" hreflang="en">English</a>{% endif %}
