<nav class="tabs" aria-label="{{ _('الهيكل المدرسي') }}">
{% for k, lab in tabs %}
  {% if (k == 'periods' and has_perm('timetable.manage')) or (k != 'periods' and has_perm('structure.manage')) %}
  <a href="{{ url_for('structure.items', key=k) }}" class="{{ 'on' if k == key else '' }}">{{ _(lab) }}</a>
  {% endif %}
{% endfor %}
</nav>
