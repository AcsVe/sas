{% extends 'base.html' %}
{% block title %}{{ _('قسم') }}{% endblock %}
{% block content %}
<h1>{{ _('تعديل القسم: ') ~ d.name if d.id else _('قسم جديد') }}</h1>
<div class="card"><form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row">
    <div><label>{{ _('اسم القسم') }}</label><input type="text" name="name" value="{{ d.name or '' }}" required></div>
    <div><label>{{ _('الكود') }}</label><input type="text" name="code" value="{{ d.code or '' }}" dir="ltr" required>
      <p class="hint">{{ _('معرّف داخلي فقط، ولم يعد يُستخدم للدخول.') }}</p></div>
    <div><label>{{ _('الأيقونة') }}</label><input type="text" name="icon" value="{{ d.icon or '🏢' }}"></div>
    <div><label>{{ _('النوع') }}</label><select name="dept_type">{% for k, v in types %}
      <option value="{{ k }}" {% if d.dept_type == k %}selected{% endif %}>{{ _(v) }}</option>{% endfor %}</select></div>
  </div>
  <div class="row">
    <div><label>{{ _('اسم المسؤول') }}</label><input type="text" name="manager_name" value="{{ d.manager_name or '' }}"></div>
    <div><label>{{ _('البريد (أكثر من بريد يُفصل بفاصلة)') }}</label><input type="text" name="emails" value="{{ d.emails or '' }}" dir="ltr"></div>
    <div><label>{{ _('الترتيب') }}</label><input type="number" name="sort_order" value="{{ d.sort_order or 0 }}"></div>
    <div><label>{{ _('الحالة') }}</label><select name="is_active">
      <option value="1" {% if d.is_active %}selected{% endif %}>{{ _('فعّال') }}</option>
      <option value="0" {% if not d.is_active %}selected{% endif %}>{{ _('متوقف') }}</option></select></div>
  </div>
  <button class="btn" type="submit">{{ _('حفظ') }}</button>
  <a class="btn secondary" href="{{ url_for('admin.departments') }}">{{ _('إلغاء') }}</a>
</form></div>
{% endblock %}
